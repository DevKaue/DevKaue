name: Atualizar GitHub Stats

on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - scripts/**
      - .github/workflows/profile-stats.yml

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar o gerador
        run: node --test scripts/generate-stats.test.mjs
      - name: Gerar painel com dados públicos
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/generate-stats.mjs
      - name: Salvar painel atualizado
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/github-stats.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: update public GitHub stats"
            git pull --rebase origin master
            git push
          fi
